apiVersion: 1

datasources:
  # VictoriaMetrics habla PromQL (MetricsQL), así que se registra como Prometheus.
  # Eso es lo que permite que las tools query_prometheus del MCP funcionen contra VM.
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    jsonData:
      prometheusType: Prometheus
      timeInterval: 10s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
